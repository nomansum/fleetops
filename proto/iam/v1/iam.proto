syntax = "proto3";

package iam.v1;

option go_package = "github.com/fleetops/gen/iam/v1;iamv1";

// ── Messages ─────────────────────────────────────────────────────────────────

message User {
  string id         = 1;
  string tenant_id  = 2;
  string email      = 3;
  string name       = 4;
  Role   role       = 5;
  bool   active     = 6;
  string created_at = 7;
}

message Tenant {
  string id            = 1;
  string name          = 2;
  string billing_email = 3;
  Plan   plan          = 4;
  bool   active        = 5;
  string created_at    = 6;
}

message ServiceAccount {
  string client_id     = 1;
  string tenant_id     = 2;
  string name          = 3;
  repeated string scopes = 4;
  string created_at    = 5;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_ADMIN       = 1;
  ROLE_DISPATCHER  = 2;
  ROLE_DRIVER      = 3;
  ROLE_FINANCE     = 4;
}

enum Plan {
  PLAN_UNSPECIFIED = 0;
  PLAN_FREE        = 1;
  PLAN_PRO         = 2;
  PLAN_ENTERPRISE  = 3;
}

// ── Register ──────────────────────────────────────────────────────────────────
message RegisterRequest {
  string tenant_name    = 1;
  string billing_email  = 2;
  string admin_name     = 3;
  string admin_email    = 4;
  string admin_password = 5;
}

message RegisterResponse {
  Tenant tenant = 1;
  User   admin  = 2;
}

// ── Login ─────────────────────────────────────────────────────────────────────
message LoginRequest {
  string email    = 1;
  string password = 2;
  string tenant_id = 3;
}

message LoginResponse {
  string access_token  = 1;
  string refresh_token = 2;
  int64  expires_in    = 3; // seconds
  User   user          = 4;
}

// ── Token validation ──────────────────────────────────────────────────────────
message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  string user_id   = 1;
  string tenant_id = 2;
  string role      = 3;
  string jti       = 4;
  bool   valid     = 5;
}

// ── Revoke token ──────────────────────────────────────────────────────────────
message RevokeTokenRequest {
  string jti = 1;
}

message RevokeTokenResponse {
  bool success = 1;
}

// ── Refresh token ─────────────────────────────────────────────────────────────
message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  int64  expires_in   = 2;
}

// ── Get user ──────────────────────────────────────────────────────────────────
message GetUserRequest {
  string user_id = 1;
}

message ListUsersRequest {
  string tenant_id  = 1;
  int32  page_size  = 2;
  string page_token = 3;
}

message ListUsersResponse {
  repeated User users          = 1;
  string        next_page_token = 2;
}

// ── Service account ───────────────────────────────────────────────────────────
message CreateServiceAccountRequest {
  string tenant_id       = 1;
  string name            = 2;
  repeated string scopes = 3;
}

message ServiceAccountTokenRequest {
  string client_id     = 1;
  string client_secret = 2;
}

message ServiceAccountTokenResponse {
  string access_token = 1;
  int64  expires_in   = 2;
}

// ── Service ───────────────────────────────────────────────────────────────────
service IAMService {
  rpc Register              (RegisterRequest)              returns (RegisterResponse);
  rpc Login                 (LoginRequest)                 returns (LoginResponse);
  rpc RefreshToken          (RefreshTokenRequest)          returns (RefreshTokenResponse);
  rpc ValidateToken         (ValidateTokenRequest)         returns (ValidateTokenResponse);
  rpc RevokeToken           (RevokeTokenRequest)           returns (RevokeTokenResponse);
  rpc GetUser               (GetUserRequest)               returns (User);
  rpc ListUsers             (ListUsersRequest)             returns (ListUsersResponse);
  rpc CreateServiceAccount  (CreateServiceAccountRequest)  returns (ServiceAccount);
  rpc GetServiceAccountToken(ServiceAccountTokenRequest)   returns (ServiceAccountTokenResponse);
}
